name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke-test the built CLI
        run: |
          node packages/cli/dist/index.js --help
          node packages/cli/dist/index.js --version
          SMOKE_DIR="$(mktemp -d)"
          node packages/cli/dist/index.js init --name smoke-app --template node-app --dir "$SMOKE_DIR"
          node -e 'const p = require(process.argv[1]); if (p.name !== "smoke-app") { console.error(p); process.exit(1); }' "$SMOKE_DIR/package.json"
