name: Nightly maintenance

on:
  schedule:
    # 02:00 UTC every day.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Generate nightly maintenance commits
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create maintenance branch
        id: branch
        run: |
          BRANCH="nightly/maintenance-$(date -u +%Y-%m-%d)"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run nightly maintenance tasks
        id: nightly
        continue-on-error: true
        run: pnpm nightly:maintenance

      - name: Count generated commits
        id: commits
        run: |
          COUNT=$(git rev-list --count main..HEAD)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Nightly run produced $COUNT commits."

      - name: Fail when the nightly minimum was not met
        if: steps.nightly.outcome == 'failure' || steps.commits.outputs.count < 10
        run: |
          echo "::error::Nightly maintenance produced ${{ steps.commits.outputs.count }} commits; at least 10 are required."
          exit 1

      - name: Push maintenance branch
        if: steps.commits.outputs.count != '0'
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          git fetch origin "$BRANCH" || true
          git push --force-with-lease origin "$BRANCH"

      - name: Open or update pull request
        if: steps.commits.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          TITLE="chore(nightly): maintenance $(date -u +%Y-%m-%d)"
          {
            echo "Automated nightly maintenance run."
            echo
            echo "This pull request contains **${{ steps.commits.outputs.count }}** commits"
            echo "generated by \`pnpm nightly:maintenance\`. Every task refreshes one"
            echo "repository report and records a run-stamped row in \`docs/metrics/history/\`."
            echo
            echo "### Commits"
            echo
            git log --reverse --pretty=format:"- %s" main..HEAD
            echo
            echo
            echo "### Run"
            echo
            echo "- Workflow: \`${{ github.workflow }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > pr-body.md

          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file pr-body.md
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file pr-body.md
          fi
